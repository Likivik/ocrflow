[project]
name = "nc-ocr-flow"
version = "0.4.0"
description = "Nextcloud OCR: three-engine architecture (google|tesseract|minimax) with sandwich PDF"
requires-python = ">=3.12,<4"
dependencies = [
  "pymupdf>=1.24",
  "pillow>=10.0",
  "requests>=2.31",
  "img2pdf>=0.5",
  "numpy>=1.26",
  "onnxruntime>=1.17",
  "fastapi>=0.100",
  "uvicorn>=0.20",
  "pydantic>=2.0",
]

[project.scripts]
nc-ocr-extract = "nc_ocr_flow.extract:main"

[project.optional-dependencies]
google = [
  "google-cloud-vision>=3.7",
  "google-cloud-storage>=2.14",
]
minimax = [
  # MiniMax-M3 is OpenAI-compatible; no extra package needed, but
  # we keep this group for parity with other engines.
]
# pdf-inspector is a Rust-backed PDF classifier used to decide if a
# freshly-uploaded PDF is already born-digital (skip OCR) or genuinely
# needs it. Falls back to a PyMuPDF heuristic if missing.
classify = [
  "pdf-inspector>=1.25",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "pdf-inspector>=1.25",
  "ruff==0.16.10",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nc_ocr_flow"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["__pycache__"]

[tool.ruff.lint]
# Modern sane set: E/F/W core pycodestyle/pyflakes, I isort, B bugbear,
# UP pyupgrade, SIM flake8-simplify, C4 flake8-comprehensions, RUF ruff-specific.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
# Allow tests to use plain asserts (B011 is "assert-on-tuple" etc. is fine
# to allow here; flake8-bugbear's B008 — function-call-in-default-argument —
# is also acceptable because pytest fixtures and FastAPI Depends() rely on
# it. Neither is enabled above; this block is here so future additions are
# surfaced for review rather than silently ignored.
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests intentionally import private helpers and shadow names; the strict
# rules around leading underscores and unused names are noise there.
"tests/**" = ["F401", "F811", "B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Non-strict by intent: this is a 60-file legacy port, not a greenfield
# library. Crank these up only when the typecheck job is green in CI.
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = false
warn_return_any = false