# Keep the CI actions current.
#
# .github/workflows/ci.yml pins every action to a full commit SHA — pinning is
# the supply-chain fix (a tag can be moved, a branch definitely can), but a
# pinned SHA never moves on its own. Dependabot is what moves it, in a
# reviewable commit.
#
# One PR per action is deliberate: bumping an action is a trust event, and
# batching several into one PR hides which upstream actually moved.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  # Python runtime dependencies: floors live in pyproject.toml, so a bump here
  # surfaces upstream drift (and security advisories) instead of staying
  # invisible until something breaks.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    open-pull-requests-limit: 5

  # The `docker` ecosystem is deliberately absent until the Dockerfile lands:
  # Dependabot fails a run for every configured ecosystem it cannot find, and a
  # permanently red job is a permanently ignored job. Re-add it with the image.
